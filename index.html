<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>META AI PANEL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;padding:10px;display:flex;justify-content:center;
background:linear-gradient(135deg,#070a13,#0b1530);
color:#eef3ff;font-family:Arial,sans-serif
}
.card{
width:100%;max-width:520px;padding:14px;border-radius:18px;
background:rgba(255,255,255,.08);box-shadow:0 0 25px #2563eb
}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.title{font-size:18px;font-weight:900}
.sub{font-size:11px;color:#a7b3d1;margin-top:4px}
.badge{border:1px solid #ffffff24;border-radius:30px;padding:5px 10px;font-size:10px}
.panel{padding:12px;background:#0004;border:1px solid #ffffff24;border-radius:16px}
.display{
min-height:80px;padding:15px;margin-bottom:12px;border-radius:13px;
border:1px solid #ffffff24;background:#080e1d;
display:flex;justify-content:center;align-items:center;
text-align:center;overflow-wrap:anywhere;font-size:21px;font-weight:900
}
.timer{color:#22c55e;font-size:27px}
.copyBtn{
width:100%;padding:14px;border:0;border-radius:13px;
background:linear-gradient(135deg,#4f8cff,#2563eb);
color:white;font-size:14px;font-weight:900;cursor:pointer
}
.copyBtn:disabled{opacity:.6;cursor:not-allowed}
.toast{
position:fixed;top:12px;left:50%;transform:translateX(-50%);
background:#111827;padding:10px 14px;border-radius:10px;
opacity:0;transition:.2s;pointer-events:none
}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="card">
  <div class="top">
    <div>
      <div class="title">META AI PANEL</div>
      <div class="sub">Created By Tamim</div>
    </div>
    <div class="badge">🇧🇩 META AI</div>
  </div>

  <div class="panel">
    <div class="display" id="display">Loading...</div>
    <button class="copyBtn" id="copyBtn">COPY AND DELETE (0)</button>
  </div>
</div>

<script>
const URL="https://script.google.com/macros/s/AKfycbxs5UnBzGbXDsbX_I027WP7RVdGrKBuKZpYGGPEee3l6lkr670YDne_A-cwdznjFeWMhg/exec";
const SERVICE="rangeid01";

const display=document.getElementById("display");
const copyBtn=document.getElementById("copyBtn");
const toast=document.getElementById("toast");

const NUMBER_KEY="meta_pending_number";
const LOCK_KEY="meta_next_allowed";

let currentNumber=localStorage.getItem(NUMBER_KEY)||"";
let nextAllowed=Number(localStorage.getItem(LOCK_KEY)||0);
let busy=false;
let timer=null;
let toastTimer=null;

function notify(msg){
toast.textContent=msg;
toast.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>toast.classList.remove("show"),1800);
}

function showNumber(){
if(currentNumber){
display.textContent=currentNumber;
copyBtn.disabled=false;
}else{
display.textContent="Loading...";
copyBtn.disabled=true;
}
}

async function loadTotal(){
try{
const r=await fetch(URL+"?action=total&service="+encodeURIComponent(SERVICE),{cache:"no-store"});
const d=await r.json();
copyBtn.textContent="COPY & DELETE ("+(d.total??0)+")";
}catch{
copyBtn.textContent="COPY & DELETE (--)";
}
}

async function loadNumber(){
if(busy||currentNumber||Date.now()<nextAllowed)return;

busy=true;
copyBtn.disabled=true;
display.textContent="Loading...";

try{
const r=await fetch(URL+"?action=get&service="+encodeURIComponent(SERVICE)+"&need=1",{cache:"no-store"});
const d=await r.json();
const numbers=d.numbers||[];

if(!numbers.length){
display.textContent="No Number Available";
return;
}

currentNumber=String(numbers[0]);
localStorage.setItem(NUMBER_KEY,currentNumber);
showNumber();

}catch(e){
display.textContent="Connection Error";
copyBtn.disabled=false;
}finally{
busy=false;
}
}

function startTimer(){
clearInterval(timer);

function tick(){
const left=Math.max(0,Math.ceil((nextAllowed-Date.now())/1000));

if(left>0){
display.innerHTML='<span class="timer">00:'+String(left).padStart(2,"0")+'</span>';
copyBtn.disabled=true;
}else{
clearInterval(timer);
localStorage.removeItem(LOCK_KEY);
if(!currentNumber)loadNumber();
}
}

tick();
timer=setInterval(tick,250);
}

copyBtn.addEventListener("click",async()=>{
if(busy)return;

if(Date.now()<nextAllowed){
notify("Please wait");
return;
}

if(!currentNumber){
loadNumber();
return;
}

busy=true;
copyBtn.disabled=true;

try{
await navigator.clipboard.writeText(currentNumber);

// Delete only after successful copy
currentNumber="";
localStorage.removeItem(NUMBER_KEY);
display.textContent="";
notify("Copied and Deleted");

nextAllowed=Date.now()+10000;
localStorage.setItem(LOCK_KEY,String(nextAllowed));

startTimer();
loadTotal();

}catch(e){
notify("Copy Failed - Number Kept");
showNumber();
}finally{
busy=false;
}
});

// Restore saved number or existing cooldown on every visit
if(currentNumber){
showNumber();
}else if(Date.now()<nextAllowed){
startTimer();
}else{
loadNumber();
}

loadTotal();
if(Date.now()<nextAllowed)startTimer();
</script>
</body>
</html>
