<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>META AI PANEL</title>

<style>

:root{

--bg:#070A13;
--bg2:#0B1530;

--border:rgba(255,255,255,.14);

--text:#EEF3FF;
--muted:#A7B3D1;

--blue1:#4F8CFF;
--blue2:#2563EB;

--green1:#22c55e;
--green2:#16a34a;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

background:linear-gradient(
135deg,
var(--bg),
var(--bg2)
);

font-family:sans-serif;

color:var(--text);

display:flex;
justify-content:center;

padding:10px;

}

.card{

width:100%;
max-width:520px;

background:rgba(255,255,255,.08);

border-radius:18px;

padding:14px;

box-shadow:0 0 25px #2563eb;

}

.top{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:12px;

}

.title{

font-size:18px;
font-weight:900;

}

.sub{

font-size:11px;
color:var(--muted);

}

.badge{

border:1px solid var(--border);

border-radius:999px;

padding:5px 10px;

font-size:10px;

}

.panel{

background:rgba(0,0,0,.25);

border:1px solid var(--border);

border-radius:16px;

padding:12px;

}

/* PASSWORD */

.passBox{

background:rgba(245,158,11,.15);

border:1px solid rgba(245,158,11,.5);

border-radius:10px;

padding:10px;

text-align:center;

font-size:13px;

font-weight:900;

cursor:pointer;

margin-bottom:12px;

user-select:none;

}

/* ACCOUNT BOX */

.accountBox{

border:1px solid var(--border);

border-radius:14px;

padding:15px;

text-align:center;

margin-bottom:12px;

}

.accountLabel{

font-size:11px;

color:var(--muted);

margin-bottom:8px;

}

.accountValue{

font-size:32px;

font-weight:900;

}

/* COOLDOWN */

.cooldownBox{

border:2px solid #22c55e;

border-radius:14px;

padding:15px;

margin-bottom:12px;

text-align:center;

background:rgba(34,197,94,.08);

}

.cooldownLabel{

font-size:11px;

color:var(--muted);

margin-bottom:6px;

}

.cooldownValue{

font-size:32px;

font-weight:900;

color:#22c55e;

}

/* COUNTER */

.counterBox{

border:1px solid var(--border);

border-radius:12px;

padding:12px;

margin-bottom:12px;

text-align:center;

}

.counterLabel{

font-size:11px;

color:var(--muted);

margin-bottom:5px;

}

.counterValue{

font-size:28px;

font-weight:900;

}

/* BUTTON */

.getBtn{

width:100%;

border:none;

border-radius:14px;

padding:14px;

font-size:15px;

font-weight:900;

cursor:pointer;

color:#fff;

background:linear-gradient(
135deg,
var(--blue1),
var(--blue2)
);

margin-bottom:12px;

}

.getBtn:disabled{

opacity:.5;

cursor:not-allowed;

}

/* RESULT */

.resultBox{

border:1px solid var(--border);

border-radius:12px;

padding:15px;

background:rgba(255,255,255,.03);

display:flex;

justify-content:space-between;

align-items:center;

gap:10px;

margin-bottom:12px;

min-height:60px;

}

.resultNumber{

font-size:15px;

font-weight:900;

word-break:break-all;

flex:1;

}

.copyBtn{

border:none;

border-radius:8px;

padding:8px 12px;

cursor:pointer;

font-weight:900;

color:#fff;

background:linear-gradient(
135deg,
var(--green1),
var(--green2)
);

}

/* HISTORY */

.historyTitle{

text-align:center;

font-size:14px;

font-weight:900;

margin-bottom:10px;

}

.history{

display:grid;

gap:8px;

}

.hBox{

border:1px solid var(--border);

border-radius:12px;

padding:10px;

background:rgba(255,255,255,.03);

font-weight:900;

}

/* TOAST */

.toast{

position:fixed;

top:12px;

left:50%;

transform:translateX(-50%);

background:rgba(0,0,0,.85);

padding:10px 14px;

border-radius:10px;

opacity:0;

transition:.2s;

z-index:999;

font-weight:900;

}

.toast.show{

opacity:1;

}

</style>

</head>

<body>

<div
class="toast"
id="toast">
</div>

<div class="card">

<div class="top">

<div>

<div class="title">
META AI PANEL
</div>

<div class="sub">
Created By Tamim
</div>

</div>

<div class="badge">
🇧🇩 META AI
</div>

</div>

<div class="panel">

<div
class="passBox"
id="passBox">

🔑 Password: Tamim100

</div>

<div class="accountBox">

<div class="accountLabel">

TOTAL META AI ACCOUNT

</div>

<div
class="accountValue"
id="rangeTotal">

0

</div>

</div>

<div
class="cooldownBox">

<div class="cooldownLabel">

CURRENT COOLDOWN

</div>

<div
class="cooldownValue"
id="cooldown">

READY

</div>

</div>

<div
class="counterBox">

<div class="counterLabel">

TOTAL META AI ACCOUNT  TAKEN

</div>

<div
class="counterValue"
id="counter">

0

</div>

</div>

<button
class="getBtn"
id="getBtn">

╰┈➤ GET META AI💻✌︎㋡

</button>

<div
class="resultBox"
id="resultBox">

<div
class="resultNumber"
id="resultNumber">

</div>

<button
class="copyBtn"
id="copyBtn"
style="display:none">

Copy

</button>

</div>

<div
class="historyTitle">

HISTORY

</div>

<div
class="history"
id="history">

</div>
</div>
</div>

<script>

const URL =
"https://script.google.com/macros/s/AKfycbxs5UnBzGbXDsbX_I027WP7RVdGrKBuKZpYGGPEee3l6lkr670YDne_A-cwdznjFeWMhg/exec";

const SERVICE = "rangeid01";

const HISTORY_KEY = "meta_history";
const COUNT_KEY = "meta_counter";
const LOCK_KEY = "meta_lock";
const RESULT_KEY = "meta_result";
const RESET_KEY = "meta_reset";

const toast =
document.getElementById("toast");

const passBox =
document.getElementById("passBox");

const rangeTotal =
document.getElementById("rangeTotal");

const cooldownEl =
document.getElementById("cooldown");

const counterEl =
document.getElementById("counter");

const resultBox =
document.getElementById("resultBox");

const resultNumber =
document.getElementById("resultNumber");

const copyBtn =
document.getElementById("copyBtn");

const historyEl =
document.getElementById("history");

const getBtn =
document.getElementById("getBtn");

/* TOAST */

function showToast(msg){

toast.textContent = msg;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},2500);

}

/* PASSWORD COPY */

passBox.onclick = async ()=>{

try{

await navigator
.clipboard
.writeText(
"Tamim100"
);

showToast(
"Password Copied"
);

}catch{

showToast(
"Copy Failed"
);

}

};

/* HISTORY */

function getHistory(){

return JSON.parse(

localStorage.getItem(
HISTORY_KEY
) || "[]"

);

}

function saveHistory(arr){

/* ONLY 2 HISTORY */

localStorage.setItem(

HISTORY_KEY,

JSON.stringify(
arr.slice(0,2)
)

);

}

function addHistory(num){

let h =
getHistory();

h.unshift(num);

saveHistory(h);

renderHistory();

}

function renderHistory(){

const h =
getHistory();

historyEl.innerHTML =
"";

if(h.length===0){

historyEl.innerHTML =

`

<div class="hBox">

No History

</div>

`;

return;

}

h.forEach(item=>{

historyEl.innerHTML +=

`

<div class="hBox">

${item}

</div>

`;

});

}

/* COUNTER */

function getCounter(){

return Number(

localStorage.getItem(
COUNT_KEY
) || 0

);

}

function setCounter(v){

localStorage.setItem(
COUNT_KEY,
v
);

counterEl.textContent =
v;

}

/* RESULT */

function saveResult(v){

localStorage.setItem(
RESULT_KEY,
v
);

}

function loadResult(){

const num =

localStorage.getItem(
RESULT_KEY
) || "";

if(num){

resultNumber.textContent =
num;

copyBtn.style.display =
"block";

}else{

resultNumber.textContent =
"";

copyBtn.style.display =
"none";

}

}

/* LOCK */

function setLock(ms){

localStorage.setItem(

LOCK_KEY,

Date.now()+ms

);

}

function getLock(){

return Number(

localStorage.getItem(
LOCK_KEY
) || 0

);

}

/* COOLDOWN */

function updateCooldown(){

const lockUntil =
getLock();

const now =
Date.now();

if(lockUntil<=now){

cooldownEl.textContent =
"READY";

getBtn.disabled =
false;

return;

}

const diff =
lockUntil-now;

const min =
Math.floor(
diff/60000
);

const sec =
Math.floor(
(diff%60000)
/1000
);

cooldownEl.textContent =

String(min)
.padStart(2,"0")

+":"

+

String(sec)
.padStart(2,"0");

getBtn.disabled =
true;

}

/* DAILY RESET 9 PM */

function checkDailyReset(){

const now =
new Date();

const today =
now.toDateString();

const lastReset =

localStorage.getItem(
RESET_KEY
) || "";

if(
now.getHours() >= 21
){

if(lastReset !== today){

setCounter(0);

localStorage.setItem(
RESET_KEY,
today
);

}

}

}

/* TOTAL META AI */

async function loadTotal(){

try{

const r =
await fetch(

URL+
"?action=total&service="+
SERVICE,

{
cache:"no-store"
}

);

const d =
await r.json();

rangeTotal.textContent =

d.total || 0;

}catch{}

}
async function getNumber(){

const lockUntil =
getLock();

if(Date.now() < lockUntil){

showToast(
"Cooldown Running"
);

return;
}

try{

const r =
await fetch(

URL +
"?action=get" +
"&service=" +
SERVICE +
"&need=1",

{
cache:"no-store"
}

);

const d =
await r.json();

const numbers =
d.numbers || [];

if(numbers.length===0){

showToast(
"No Number Available"
);

return;
}

const num =
numbers[0];

resultNumber.textContent =
num;

copyBtn.style.display =
"block";

saveResult(num);

let totalTaken =
getCounter() + 1;

setCounter(
totalTaken
);

/* 10 Numbers = 20 Min Lock */

if(totalTaken >= 10){

setLock(
10 * 60 * 1000
);

showToast(
"10 Minute Lock Started"
);

}else{

setLock(
45 * 1000
);

showToast(
"Waiting  45 S countdown"
);

}

updateCooldown();

loadTotal();

}catch(err){

showToast(
"Server Error"
);

}

}

/* COPY */

copyBtn.onclick =
async ()=>{

const num =
resultNumber.textContent;

if(!num) return;

try{

await navigator
.clipboard
.writeText(num);

addHistory(num);

/* CLEAR RESULT */

resultNumber.textContent =
"";

saveResult("");

/* HIDE COPY BUTTON */

copyBtn.style.display =
"none";

showToast(
"Copied"
);

}catch{

showToast(
"Copy Failed"
);

}

};

/* BUTTON */

getBtn.onclick =
getNumber;

/* INITIAL LOAD */

loadResult();

renderHistory();

setCounter(
getCounter()
);

loadTotal();

checkDailyReset();

updateCooldown();

/* LIVE UPDATE */

setInterval(()=>{

updateCooldown();

checkDailyReset();

},1000);

</script>

</body>
</html>
